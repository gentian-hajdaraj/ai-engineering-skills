name: Validate Agent Skills
on:
  push:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'README.md'
      - 'examples/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'README.md'
      - 'examples/**'
      - '.github/workflows/validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/validate.mjs
