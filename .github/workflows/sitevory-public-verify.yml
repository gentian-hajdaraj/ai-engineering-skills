# Sitevory CI ONLY: no secrets, no deploy, no WordPress calls
name: Sitevory multi-site isolated foundation build (no deploy)
on:
  push:
    branches:
      - 'ci/sitevory-multisite-foundation-20261118'
    paths:
      - 'sitevory-ci/**'
      - '.github/workflows/sitevory-public-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unpack and verify public sanitized source archive
        run: |
          mkdir -p sitevory-ci
          cat sitevory-ci/source.part*.b64 | base64 -d > sitevory-ci/source.tar.gz
          echo '1d400d9cbd4a15f7441df3d646a1b6d3311af10235dbf470cc3d1bf5c22cdf7c  sitevory-ci/source.tar.gz' | sha256sum -c -
          tar -xzf sitevory-ci/source.tar.gz -C sitevory-ci
          node sitevory-ci/apply-type-fixes.mjs
      - name: Verify and restore immutable npm lockfile (SHA-256 pinned)
        working-directory: sitevory-ci
        run: node scripts/restore-verified-lock.mjs
      - name: Reproducible install with committed lockfile (no publish)
        working-directory: sitevory-ci
        run: npm ci --no-audit --no-fund
      - name: Run portable OAuth security tests, strict typecheck and Wrangler build dry-run
        working-directory: sitevory-ci
        run: |
          node --test tests/pairing.test.mjs tests/read-only-surface.test.mjs
          npm run typecheck
          npm run dry-run
      - name: Export sanitized compiled Worker bundle to logs (no artifact storage)
        working-directory: sitevory-ci
        run: |
          BUNDLE="$(find .wrangler-dry-run -type f -name '*.js' | head -n 1)"
          test -n "$BUNDLE" && test -f "$BUNDLE"
          node - "$BUNDLE" <<'NODE'
          const fs = require('node:fs');
          const code = fs.readFileSync(process.argv[2], 'utf8');
          if (code.includes('leadpower.it') || code.includes('5d77b860d98849a3b94dd77fcfd72ff8')) throw Error('Unsanitized bundle');
          console.log('PUBLIC_BUNDLE_SANITIZED_OK');
          NODE
          sha256sum "$BUNDLE"
          echo SITEVORY_BUNDLE_GZIP_BASE64_BEGIN
          gzip -n -c "$BUNDLE" | base64 -w0
          echo
          echo SITEVORY_BUNDLE_GZIP_BASE64_END
      - name: Sitevory live metadata smoke test (public GET, no credentials)
        env:
          SITEVORY_BASE: https://sitevory-mcp.polished-dust-5ee4.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const paths = ['/.well-known/oauth-authorization-server', '/.well-known/oauth-protected-resource', '/mcp'];
          let problem = false;
          for (const path of paths) {
            try {
              const r = await fetch(process.env.SITEVORY_BASE + path, {
                method: 'GET', redirect: 'manual',
                headers: { 'Accept': 'application/json' },
                signal: AbortSignal.timeout(12000)
              });
              const safe = {
                path, status: r.status,
                content_type: (r.headers.get('content-type') || '').slice(0, 75),
                oauth_challenge: Boolean(r.headers.get('www-authenticate')?.includes('Bearer'))
              };
              console.log('SITEVORY_SMOKE', JSON.stringify(safe));
              if (r.status >= 500 || (path.includes('.well-known') && r.status !== 200) || (path === '/mcp' && ![401,405].includes(r.status))) problem = true;
              await r.body?.cancel();
            } catch (e) {
              console.log('SITEVORY_SMOKE_FAILURE', path, String(e).slice(0, 160));
              problem = true;
            }
          }
          if (problem) process.exitCode = 1;
          NODE
      - name: Verify ChatGPT OAuth metadata compatibility (public discovery only)
        env:
          SITEVORY_BASE: https://sitevory-mcp.polished-dust-5ee4.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.SITEVORY_BASE;
          const options = {headers:{Accept:'application/json'}, signal:AbortSignal.timeout(10000)};
          const [authorization, protectedResource] = await Promise.all([
            fetch(base+'/.well-known/oauth-authorization-server',options).then(x=>x.json()),
            fetch(base+'/.well-known/oauth-protected-resource',options).then(x=>x.json())
          ]);
          const checks={
            issuer:authorization.issuer===base,
            authorization_endpoint:authorization.authorization_endpoint?.startsWith(base+'/'),
            token_endpoint:authorization.token_endpoint?.startsWith(base+'/'),
            pkce_s256:authorization.code_challenge_methods_supported?.includes('S256'),
            dynamic_client_registration:authorization.registration_endpoint?.startsWith(base+'/'),
            protected_resource:protectedResource.resource===base+'/mcp',
            authorization_server_link:protectedResource.authorization_servers?.includes(base)
          };
          console.log('SITEVORY_OAUTH_DISCOVERY',JSON.stringify(checks));
          console.log('SITEVORY_REFRESH_SUPPORT', JSON.stringify({
            offline_access_advertised:authorization.scopes_supported?.includes('offline_access')||false,
            refresh_grant_advertised:authorization.grant_types_supported?.includes('refresh_token')||false
          }));
          if (Object.values(checks).some(x=>!x)) process.exitCode=1;
          NODE
      - name: Confirm production deploy is impossible in this public mirror
        working-directory: sitevory-ci
        run: |
          if npm run deploy; then echo 'ERROR: deployment unexpectedly enabled' >&2; exit 1; fi
