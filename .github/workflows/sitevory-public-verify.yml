# Sitevory CI ONLY: no secrets, no deploy, no WordPress calls
name: Sitevory OAuth public build verification
on:
  push:
    branches:
      - 'ci/sitevory-oauth-public-20261118'
    paths:
      - 'sitevory-ci/**'
      - '.github/workflows/sitevory-public-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unpack and verify public sanitized source archive
        run: |
          mkdir -p sitevory-ci
          cat sitevory-ci/source.part*.b64 | base64 -d > sitevory-ci/source.tar.gz
          echo '1d400d9cbd4a15f7441df3d646a1b6d3311af10235dbf470cc3d1bf5c22cdf7c  sitevory-ci/source.tar.gz' | sha256sum -c -
          tar -xzf sitevory-ci/source.tar.gz -C sitevory-ci
          node sitevory-ci/apply-type-fixes.mjs
      - name: Verify and restore immutable npm lockfile (SHA-256 pinned)
        working-directory: sitevory-ci
        run: node scripts/restore-verified-lock.mjs
      - name: Reproducible install with committed lockfile (no publish)
        working-directory: sitevory-ci
        run: npm ci --no-audit --no-fund
      - name: Run portable OAuth security tests, strict typecheck and Wrangler build dry-run
        working-directory: sitevory-ci
        run: |
          node --test tests/pairing.test.mjs tests/read-only-surface.test.mjs
          npm run typecheck
          npm run dry-run
      - name: Export sanitized compiled Worker bundle to logs (no artifact storage)
        working-directory: sitevory-ci
        run: |
          BUNDLE="$(find .wrangler-dry-run -type f -name '*.js' | head -n 1)"
          test -n "$BUNDLE" && test -f "$BUNDLE"
          node - "$BUNDLE" <<'NODE'
          const fs = require('node:fs');
          const code = fs.readFileSync(process.argv[2], 'utf8');
          if (code.includes('leadpower.it') || code.includes('5d77b860d98849a3b94dd77fcfd72ff8')) throw Error('Unsanitized bundle');
          console.log('PUBLIC_BUNDLE_SANITIZED_OK');
          NODE
          sha256sum "$BUNDLE"
          echo SITEVORY_BUNDLE_GZIP_BASE64_BEGIN
          gzip -n -c "$BUNDLE" | base64 -w0
          echo
          echo SITEVORY_BUNDLE_GZIP_BASE64_END
      - name: Confirm production deploy is impossible in this public mirror
        working-directory: sitevory-ci
        run: |
          if npm run deploy; then echo 'ERROR: deployment unexpectedly enabled' >&2; exit 1; fi
