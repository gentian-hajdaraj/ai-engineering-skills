# Sitevory CI ONLY: no secrets, no deploy, no WordPress calls
name: Sitevory OAuth public build verification
on:
  push:
    branches:
      - 'ci/sitevory-oauth-public-20261118'
    paths:
      - 'sitevory-ci/**'
      - '.github/workflows/sitevory-public-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unpack and verify public sanitized source archive
        run: |
          mkdir -p sitevory-ci
          cat sitevory-ci/source.part*.b64 | base64 -d > sitevory-ci/source.tar.gz
          echo '1d400d9cbd4a15f7441df3d646a1b6d3311af10235dbf470cc3d1bf5c22cdf7c  sitevory-ci/source.tar.gz' | sha256sum -c -
          tar -xzf sitevory-ci/source.tar.gz -C sitevory-ci
          node sitevory-ci/apply-type-fixes.mjs
      - name: Restore committed lockfile and verify pinned runtime dependencies
        working-directory: sitevory-ci
        run: |
          base64 -d package-lock.json.gz.b64 | gzip -d > package-lock.json
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (lock.lockfileVersion !== 3) process.exit(1);
          for (const [name, version] of Object.entries(pkg.dependencies)) {
            if (lock.packages?.['node_modules/' + name]?.version !== version) {
              console.error('Lockfile mismatch for', name);
              process.exit(1);
            }
          }
          console.log('LOCKFILE_OK; sha256 recorded in next step');
          NODE
          sha256sum package-lock.json
      - name: Reproducible install with committed lockfile (no publish)
        working-directory: sitevory-ci
        run: npm ci --no-audit --no-fund
      - name: Run strict typecheck and Wrangler build dry-run
        working-directory: sitevory-ci
        run: npm run typecheck && npm run dry-run
      - name: Confirm production deploy is impossible in this public mirror
        working-directory: sitevory-ci
        run: |
          if npm run deploy; then echo 'ERROR: deployment unexpectedly enabled' >&2; exit 1; fi
